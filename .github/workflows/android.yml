name: Android

on:
  push:
    branches: [android]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'leanmiguel/oh-my-pi-android'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Install native build tools and Rust target
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build pkg-config clang
          toolchain=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal --target aarch64-linux-android
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check loader and package types
        run: |
          bun test packages/natives/test/android-loader.test.ts packages/natives/test/windows-staging.test.ts
          bun --cwd=packages/natives run check:types
          bun --cwd=packages/coding-agent run check:types
          python3 -m unittest discover -s android -p 'test_*.py'
      - name: Download pinned official Android build tools
        shell: bash
        run: |
          curl -fLsS --retry 3 https://dl.google.com/android/repository/android-ndk-r27d-linux.zip -o "$RUNNER_TEMP/ndk.zip"
          curl -fLsS --retry 3 https://github.com/oven-sh/bun/releases/download/bun-v1.4.3/bun-linux-aarch64-android.zip -o "$RUNNER_TEMP/bun.zip"
          cd "$RUNNER_TEMP"
          echo '601246087a682d1944e1e16dd85bc6e49560fe8b6d61255be2829178c8ed15d9  ndk.zip' | sha256sum -c -
          echo 'e8848b6c67769ef1dcf932c1aabafbeaefdea0dd98f715e9455424998242deda  bun.zip' | sha256sum -c -
          unzip -q ndk.zip
          unzip -q bun.zip
          echo "ANDROID_NDK_HOME=$RUNNER_TEMP/android-ndk-r27d" >> "$GITHUB_ENV"
          echo "OMP_ANDROID_BUN=$RUNNER_TEMP/bun-linux-aarch64-android/bun" >> "$GITHUB_ENV"
      - name: Build Android executable
        env:
          CARGO_BUILD_JOBS: '2'
        run: sh android/build.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omp-android-arm64
          path: android/dist/
          retention-days: 14

  smoke:
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: omp-android-arm64
          path: android/dist
      - name: Run in native ARM64 Termux/Bionic
        shell: bash
        run: |
          chmod +x android/dist/omp
          docker run --rm --security-opt seccomp=unconfined \
            -v "$PWD/android/dist:/artifacts:ro" \
            -v "$PWD/android/smoke.sh:/smoke.sh:ro" \
            termux/termux-docker:aarch64 \
            sh -c 'mkdir -p "$HOME/.local/bin"; cp /artifacts/omp "$HOME/.local/bin/omp"; chmod +x "$HOME/.local/bin/omp"; export OMP_ANDROID_EXECUTABLE="$HOME/.local/bin/omp"; sh /smoke.sh'

  release:
    needs: [build, smoke]
    if: github.ref == 'refs/heads/android'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: omp-android-arm64
          path: android/dist
      - name: Publish tested Android build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(jq -r .version packages/coding-agent/package.json)
          tag="android-${version}-${GITHUB_SHA:0:12}"
          if gh release view "$tag" >/dev/null 2>&1; then exit 0; fi
          gh release create "$tag" --target "$GITHUB_SHA" \
            --title "OMP Android $version (${GITHUB_SHA:0:12})" \
            --notes-file android/RELEASE_NOTES.md \
            android/dist/omp-android-arm64.tar.gz android/dist/SHA256SUMS
